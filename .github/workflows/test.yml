name: Infrastructure tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAPPA_BUILD_JOBS: '2'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.5'
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake gfortran
      - run: julia --startup-file=no --project=. scripts/setup.jl
      - run: julia --startup-file=no --threads=2 --project=. -e 'using Pkg; Pkg.test()'
      - run: julia --startup-file=no --threads=2 --project=. examples/synthetic.jl
